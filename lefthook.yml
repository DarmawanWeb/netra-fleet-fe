pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,css}"
      run: npx prettier --check {staged_files}
    eslint:
      glob: "*.{ts,tsx}"
      run: npx eslint {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
commit-msg:
  commands:
    conventional:
      run: |
        grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' {1} || { echo "use conventional commits, e.g. feat(map): add layers"; exit 1; }
